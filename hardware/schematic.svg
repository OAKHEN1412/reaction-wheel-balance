<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1380" viewBox="0 0 1900 1380" font-family="Segoe UI, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="1900" height="1380" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="35" font-size="24" font-weight="bold" fill="#111">Reaction Wheel Balance — Wiring / Schematic Block Diagram</text>
  <text x="30" y="58" font-size="13" fill="#444">ESP32-C3 Super Mini (3.3V) + MPU-6050 GY-521 + BLDC-3640 (built-in driver) — pins match hardware/wiring.md pin table exactly</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="1500" y="20" width="380" height="155" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="1515" y="38" font-size="13" font-weight="bold" fill="#111">Legend</text>
  <line x1="1515" y1="54" x2="1545" y2="54" stroke="#cc0000" stroke-width="3"/>
  <text x="1552" y="58" font-size="10" fill="#222">Red — +12V or +5V power</text>
  <line x1="1515" y1="69" x2="1545" y2="69" stroke="#111111" stroke-width="3"/>
  <text x="1552" y="73" font-size="10" fill="#222">Black — GND</text>
  <line x1="1515" y1="84" x2="1545" y2="84" stroke="#1f6fd6" stroke-width="2.5"/>
  <text x="1552" y="88" font-size="10" fill="#222">Blue — PWM (speed)</text>
  <line x1="1515" y1="99" x2="1545" y2="99" stroke="#d9a300" stroke-width="2.5"/>
  <text x="1552" y="103" font-size="10" fill="#222">Yellow — F/R direction (CW/CCW)</text>
  <line x1="1515" y1="114" x2="1545" y2="114" stroke="#e07b00" stroke-width="2.5"/>
  <text x="1552" y="118" font-size="10" fill="#222">Orange — BRAKE</text>
  <line x1="1515" y1="129" x2="1545" y2="129" stroke="#1f9d55" stroke-width="2.5"/>
  <text x="1552" y="133" font-size="10" fill="#222">Green — FG speed-pulse output</text>
  <text x="1515" y="146" font-size="9" fill="#555">Dashed stub + circle = net label (same name = same net).</text>
  <text x="1515" y="158" font-size="9" fill="#555">Lines crossing WITHOUT a dot are NOT connected.</text>

  <!-- ===================== BATTERY ===================== -->
  <rect x="40" y="540" width="200" height="110" rx="8" fill="#FFF6CC" stroke="#333" stroke-width="2"/>
  <text x="140" y="560" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">12V Li-ion 18650 Pack</text>
  <text x="140" y="578" font-size="11" text-anchor="middle" fill="#333">+ BMS (DC120-5203M)</text>
  <text x="140" y="594" font-size="11" text-anchor="middle" fill="#333">~2.4 Ah, 3S</text>
  <text x="140" y="622" font-size="10" text-anchor="middle" fill="#555">Battery</text>

  <!-- battery+ -> switch -->
  <line x1="240" y1="620" x2="300" y2="620" stroke="#cc0000" stroke-width="3"/>
  <!-- battery- -> GND bus (this is the star-ground reference point) -->
  <line x1="140" y1="650" x2="140" y2="1000" stroke="#111111" stroke-width="2"/>
  <circle cx="140" cy="1000" r="5" fill="#111111"/>
  <text x="155" y="1015" font-size="10" fill="#111">star GND point (battery –)</text>

  <!-- ===================== SWITCH ===================== -->
  <rect x="300" y="590" width="120" height="60" rx="6" fill="#eeeeee" stroke="#333" stroke-width="2"/>
  <text x="360" y="614" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Main Switch</text>
  <text x="360" y="632" font-size="11" text-anchor="middle" fill="#333">(SW1)</text>
  <line x1="420" y1="620" x2="480" y2="620" stroke="#cc0000" stroke-width="3"/>

  <!-- ===================== FUSE ===================== -->
  <rect x="480" y="590" width="120" height="60" rx="6" fill="#eeeeee" stroke="#333" stroke-width="2"/>
  <text x="540" y="614" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Fuse</text>
  <text x="540" y="632" font-size="11" text-anchor="middle" fill="#333">3A inline</text>
  <line x1="600" y1="620" x2="680" y2="620" stroke="#cc0000" stroke-width="3"/>

  <!-- ===================== +12V BUS ===================== -->
  <line x1="680" y1="280" x2="680" y2="650" stroke="#cc0000" stroke-width="3"/>
  <circle cx="680" cy="280" r="4" fill="#cc0000"/>
  <circle cx="680" cy="620" r="4" fill="#cc0000"/>
  <circle cx="680" cy="650" r="4" fill="#cc0000"/>
  <text x="692" y="330" font-size="12" font-weight="bold" fill="#cc0000">+12V BUS</text>
  <text x="692" y="346" font-size="9" fill="#555">(feeds Buck input;</text>
  <text x="692" y="358" font-size="9" fill="#555">caps C1/C2 tap it here)</text>

  <!-- ===================== GND BUS ===================== -->
  <line x1="100" y1="1000" x2="1870" y2="1000" stroke="#111111" stroke-width="3"/>
  <text x="1560" y="992" font-size="12" font-weight="bold" fill="#111">COMMON GND BUS (star ground)</text>

  <!-- ===================== BULK CAPACITORS near motor supply ===================== -->
  <line x1="610" y1="650" x2="820" y2="650" stroke="#cc0000" stroke-width="2"/>

  <!-- C1 electrolytic 470-1000uF 25V -->
  <line x1="610" y1="650" x2="610" y2="672" stroke="#cc0000" stroke-width="2"/>
  <path d="M 594,672 A 16,9 0 0 1 626,672" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="594" y1="684" x2="626" y2="684" stroke="#333" stroke-width="2"/>
  <line x1="610" y1="684" x2="610" y2="1000" stroke="#111111" stroke-width="2"/>
  <text x="648" y="676" font-size="10" font-weight="bold" fill="#333">C1: 470–1000µF, 25V</text>
  <text x="648" y="690" font-size="9" fill="#555">(electrolytic, near motor)</text>

  <!-- C2 ceramic 100nF -->
  <line x1="820" y1="650" x2="820" y2="670" stroke="#cc0000" stroke-width="2"/>
  <line x1="805" y1="670" x2="835" y2="670" stroke="#333" stroke-width="2"/>
  <line x1="805" y1="678" x2="835" y2="678" stroke="#333" stroke-width="2"/>
  <line x1="820" y1="678" x2="820" y2="1000" stroke="#111111" stroke-width="2"/>
  <text x="848" y="672" font-size="10" font-weight="bold" fill="#333">C2: 100nF ceramic</text>

  <!-- ===================== BUCK CONVERTER ===================== -->
  <rect x="590" y="170" width="200" height="110" rx="8" fill="#D7EBFF" stroke="#333" stroke-width="2"/>
  <text x="690" y="195" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">AA451 Buck (LM2596-type)</text>
  <text x="690" y="212" font-size="11" text-anchor="middle" fill="#333">4–38 V in → 5.0 V out</text>
  <text x="690" y="237" font-size="11" font-weight="bold" text-anchor="middle" fill="#cc0000">SET 5.0V w/ multimeter</text>
  <text x="690" y="253" font-size="11" font-weight="bold" text-anchor="middle" fill="#cc0000">BEFORE connecting ESP32!</text>

  <!-- buck output -> ESP32 5V -->
  <polyline points="790,205 870,205 870,390 900,390" fill="none" stroke="#cc0000" stroke-width="3"/>
  <text x="800" y="199" font-size="10" fill="#cc0000">5V</text>

  <!-- buck GND -> GND bus -->
  <polyline points="590,255 460,255 460,1000" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="560" y="249" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="end">GND</text>

  <!-- ===================== ESP32-C3 ===================== -->
  <rect x="900" y="300" width="280" height="600" rx="10" fill="#D9F2D9" stroke="#1a5c1a" stroke-width="3"/>
  <text x="1040" y="332" font-size="15" font-weight="bold" text-anchor="middle" fill="#0d3d0d">ESP32-C3 Super Mini</text>
  <text x="1040" y="350" font-size="10" text-anchor="middle" fill="#333">3.3V logic — GPIO abs. max ≈3.6V</text>

  <!-- left pins: power -->
  <line x1="850" y1="390" x2="900" y2="390" stroke="#cc0000" stroke-width="3"/>
  <text x="845" y="384" font-size="12" text-anchor="end" fill="#111">5V</text>

  <line x1="840" y1="430" x2="900" y2="430" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="840" cy="430" r="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="835" y="424" font-size="12" text-anchor="end" fill="#111">GND</text>

  <line x1="790" y1="470" x2="900" y2="470" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="790" cy="470" r="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="845" y="464" font-size="12" text-anchor="end" fill="#111">3V3</text>

  <!-- right pins: I2C group -->
  <line x1="1180" y1="420" x2="1240" y2="420" stroke="#222222" stroke-width="2"/>
  <text x="1170" y="414" font-size="12" text-anchor="end" fill="#111">GPIO8 (SDA)*</text>

  <line x1="1180" y1="465" x2="1240" y2="465" stroke="#222222" stroke-width="2"/>
  <text x="1170" y="459" font-size="12" text-anchor="end" fill="#111">GPIO9 (SCL)*</text>

  <line x1="1180" y1="510" x2="1240" y2="510" stroke="#666666" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1170" y="504" font-size="12" text-anchor="end" fill="#111">GPIO10 (INT)</text>

  <!-- right pins: motor group (>=50px vertical spacing) -->
  <line x1="1180" y1="680" x2="1240" y2="680" stroke="#1f6fd6" stroke-width="2.5"/>
  <text x="1170" y="674" font-size="12" text-anchor="end" fill="#111">GPIO1 (PWM)</text>

  <line x1="1180" y1="730" x2="1240" y2="730" stroke="#d9a300" stroke-width="2.5"/>
  <text x="1170" y="724" font-size="12" text-anchor="end" fill="#111">GPIO2 (F/R)*</text>

  <line x1="1180" y1="780" x2="1240" y2="780" stroke="#e07b00" stroke-width="2.5"/>
  <text x="1170" y="774" font-size="12" text-anchor="end" fill="#111">GPIO3 (BRAKE)</text>

  <line x1="1240" y1="830" x2="1180" y2="830" stroke="#1f9d55" stroke-width="2.5"/>
  <text x="1170" y="824" font-size="12" text-anchor="end" fill="#111">GPIO4 (FG in)</text>

  <!-- footnote for strap pins, inside block bottom -->
  <text x="1040" y="862" font-size="10" text-anchor="middle" fill="#cc0000">* strapping pin (GPIO2/8/9) — see wiring.md risk (a)</text>
  <text x="1040" y="878" font-size="10" text-anchor="middle" fill="#cc0000">GPIO2 alt if boot issues: GPIO5 / GPIO6 / GPIO7</text>

  <!-- ===================== MPU-6050 ===================== -->
  <rect x="1560" y="190" width="300" height="360" rx="8" fill="#FFE3E3" stroke="#333" stroke-width="2"/>
  <text x="1710" y="215" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">MPU-6050</text>
  <text x="1710" y="232" font-size="11" text-anchor="middle" fill="#333">(GY-521 module)</text>

  <line x1="1560" y1="240" x2="1500" y2="240" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="1500" cy="240" r="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="1570" y="234" font-size="11" fill="#111">VCC (= net "3V3")</text>

  <line x1="1560" y1="280" x2="1500" y2="280" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="1500" cy="280" r="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="1570" y="274" font-size="11" fill="#111">GND (common net)</text>

  <line x1="1560" y1="320" x2="1490" y2="320" stroke="#111111" stroke-width="1.5"/>
  <line x1="1490" y1="320" x2="1490" y2="1000" stroke="#111111" stroke-width="1.5"/>
  <text x="1570" y="314" font-size="11" fill="#111">AD0 → GND (addr 0x68)</text>

  <line x1="1560" y1="420" x2="1500" y2="420" stroke="#222222" stroke-width="2"/>
  <text x="1570" y="414" font-size="12" fill="#111">SDA</text>

  <line x1="1560" y1="465" x2="1500" y2="465" stroke="#222222" stroke-width="2"/>
  <text x="1570" y="459" font-size="12" fill="#111">SCL</text>

  <line x1="1560" y1="510" x2="1500" y2="510" stroke="#666666" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1570" y="504" font-size="12" fill="#111">INT (optional)</text>

  <!-- connector wires ESP32 <-> MPU (I2C group), plain, no text on the wire itself -->
  <line x1="1240" y1="420" x2="1500" y2="420" stroke="#222222" stroke-width="2"/>
  <line x1="1240" y1="465" x2="1500" y2="465" stroke="#222222" stroke-width="2"/>
  <line x1="1240" y1="510" x2="1500" y2="510" stroke="#666666" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ===================== BLDC-3640 ===================== -->
  <rect x="1560" y="580" width="300" height="370" rx="8" fill="#E3E8FF" stroke="#333" stroke-width="2"/>
  <text x="1710" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">BLDC-3640</text>
  <text x="1710" y="622" font-size="10" text-anchor="middle" fill="#333">12VDC, 4000 rpm</text>
  <text x="1710" y="636" font-size="10" text-anchor="middle" fill="#333">built-in driver, 6-wire</text>

  <!-- motor control signal pins (aligned with ESP32, >=50px spacing) -->
  <line x1="1560" y1="680" x2="1500" y2="680" stroke="#1f6fd6" stroke-width="2.5"/>
  <text x="1570" y="674" font-size="12" fill="#1f6fd6">Blue = PWM speed</text>

  <line x1="1560" y1="730" x2="1500" y2="730" stroke="#d9a300" stroke-width="2.5"/>
  <text x="1570" y="724" font-size="12" fill="#a37a00">Yellow = F/R (CW/CCW)</text>

  <line x1="1560" y1="780" x2="1500" y2="780" stroke="#e07b00" stroke-width="2.5"/>
  <text x="1570" y="774" font-size="12" fill="#e07b00">Orange = BRAKE</text>

  <line x1="1500" y1="830" x2="1560" y2="830" stroke="#1f9d55" stroke-width="2.5"/>
  <text x="1570" y="824" font-size="12" fill="#1f9d55">Green = FG (open-drain out)</text>

  <!-- connector wires ESP32 <-> BLDC (motor group), plain, no text on the wire itself -->
  <line x1="1240" y1="680" x2="1500" y2="680" stroke="#1f6fd6" stroke-width="2.5"/>
  <line x1="1240" y1="730" x2="1500" y2="730" stroke="#d9a300" stroke-width="2.5"/>
  <line x1="1240" y1="780" x2="1500" y2="780" stroke="#e07b00" stroke-width="2.5"/>
  <line x1="1240" y1="830" x2="1500" y2="830" stroke="#1f9d55" stroke-width="2.5"/>

  <!-- power pins (Red/Black), placed lower in the block, net-label style, well clear of the signal rows -->
  <line x1="1560" y1="870" x2="1500" y2="870" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="1500" cy="870" r="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="1570" y="864" font-size="12" fill="#cc0000">Red = VCC 12V</text>
  <text x="1570" y="878" font-size="9" fill="#555">(net "+12V", direct — not via buck)</text>

  <line x1="1560" y1="915" x2="1500" y2="915" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="1500" cy="915" r="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="1570" y="909" font-size="12" fill="#111">Black = GND</text>
  <text x="1570" y="923" font-size="9" fill="#555">(net "GND", common)</text>

  <!-- ===================== FG PULL-UP RESISTOR (mid-corridor, clear of everything) ===================== -->
  <circle cx="1300" cy="830" r="3" fill="#1f9d55"/>
  <line x1="1300" y1="830" x2="1300" y2="850" stroke="#1f9d55" stroke-width="2"/>
  <polyline points="1300,850 1308,858 1292,866 1308,874 1292,882 1300,890" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="1300" y1="890" x2="1300" y2="905" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="1300" cy="905" r="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="1315" y="862" font-size="10" fill="#111">R_pullup</text>
  <text x="1315" y="876" font-size="10" fill="#111">4.7–10kΩ</text>
  <text x="1315" y="909" font-size="10" fill="#111">net "3V3"</text>
  <text x="1250" y="925" font-size="9" fill="#cc0000">required — FG is open-collector</text>

  <!-- ===================== ONE-CHANNEL LEVEL-SHIFT DETAIL (risk b) ===================== -->
  <rect x="60" y="1030" width="560" height="310" rx="8" fill="#fbfbfb" stroke="#999" stroke-width="1.5"/>
  <text x="75" y="1055" font-size="13" font-weight="bold" fill="#111">Detail: one-channel open-drain level-shift (risk b)</text>
  <text x="75" y="1072" font-size="10" fill="#555">Use if a motor control input back-feeds 5V into a 3.3V GPIO.</text>

  <!-- labels for the dangling ends, placed first / above the circuit row so nothing below crowds them -->
  <text x="310" y="1092" font-size="10" fill="#111">motor control wire</text>
  <text x="310" y="1104" font-size="9" fill="#555">(internal pull-up ~5V)</text>

  <!-- ESP32 GPIO -> series resistor -> NPN base, all on one row at y=1135 -->
  <text x="75" y="1139" font-size="11" fill="#111">ESP32 GPIO</text>
  <line x1="170" y1="1135" x2="200" y2="1135" stroke="#222" stroke-width="2"/>
  <polyline points="200,1135 206,1127 214,1143 222,1127 230,1143 236,1135" fill="none" stroke="#333" stroke-width="2"/>
  <text x="204" y="1122" font-size="9" fill="#333">1kΩ</text>
  <line x1="236" y1="1135" x2="255" y2="1135" stroke="#222" stroke-width="2"/>

  <!-- NPN transistor: base bar, collector up-right, emitter down-right with arrow -->
  <line x1="255" y1="1118" x2="255" y2="1152" stroke="#333" stroke-width="2.5"/>
  <line x1="255" y1="1124" x2="285" y2="1108" stroke="#333" stroke-width="2"/>
  <line x1="285" y1="1108" x2="285" y2="1085" stroke="#333" stroke-width="2"/>
  <line x1="255" y1="1146" x2="285" y2="1162" stroke="#333" stroke-width="2"/>
  <polygon points="279,1155 290,1158 282,1166" fill="#333"/>
  <line x1="285" y1="1162" x2="285" y2="1195" stroke="#333" stroke-width="2"/>

  <text x="300" y="1130" font-size="11" font-weight="bold" fill="#111">Q1</text>
  <text x="300" y="1147" font-size="9" fill="#555">2N2222 NPN or</text>
  <text x="300" y="1159" font-size="9" fill="#555">2N7000 MOSFET</text>
  <text x="300" y="1199" font-size="10" fill="#111">GND</text>

  <text x="75" y="1225" font-size="10" fill="#333">Motor line has internal pull-up to ~5V inside the driver.</text>
  <text x="75" y="1241" font-size="10" fill="#333">GPIO HIGH → Q1 ON → line pulled LOW (active).</text>
  <text x="75" y="1257" font-size="10" fill="#333">GPIO LOW → Q1 OFF → line floats HIGH via motor's pull-up (inactive).</text>
  <text x="75" y="1275" font-size="10" font-weight="bold" fill="#cc0000">Logic is inverted vs. a direct connection — firmware needs an invert flag.</text>
  <text x="75" y="1293" font-size="10" fill="#333">Simpler alt: series 1kΩ only, if motor's HIGH stays within ESP32's ~3.6V max</text>
  <text x="75" y="1309" font-size="10" fill="#333">(verify with a multimeter before relying on this).</text>

  <!-- ===================== RISK CALLOUT BOX ===================== -->
  <rect x="660" y="1030" width="1200" height="310" rx="8" fill="#fff8f0" stroke="#cc7a00" stroke-width="1.5"/>
  <text x="675" y="1055" font-size="13" font-weight="bold" fill="#a34e00">Key risks (full detail in wiring.md §5)</text>
  <text x="675" y="1082" font-size="11" fill="#333">(a) Strapping pins GPIO2/8/9: I2C pull-ups keep 8/9 high (OK); motor F/R on GPIO2 may pull it low at boot → boot glitch/loop. Alt: GPIO5/6/7.</text>
  <text x="675" y="1108" font-size="11" fill="#333">(b) Motor control inputs often pulled to ~5V internally → risk of back-feeding a 3.3V GPIO. Use series 1kΩ or open-drain stage (detail at left, inverts logic).</text>
  <text x="675" y="1134" font-size="11" fill="#333">(c) PWM/BRAKE/F-R polarity is undocumented — verify with the firmware's motor_test sketch, wheel removed or clamped, before first spin.</text>
  <text x="675" y="1160" font-size="11" fill="#333">(d) 20cm printed flywheel at high rpm: balance it, torque-check bolts, wear eye protection, clamp the frame, never reverse F/R at full speed.</text>
  <text x="675" y="1186" font-size="11" fill="#333">(e) 3S Li-ion pack: never discharge below ~9V pack (3.0V/cell); BMS present but monitor voltage regardless.</text>
  <text x="675" y="1212" font-size="11" fill="#333">Ground: all GND points (battery –, buck, ESP32, MPU, motor net, caps) tie to one common/star ground bus as shown.</text>
</svg>
